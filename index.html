<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    

    <h1> Tic Tac Toe GAME </h1>

    <input type="text" id="gameKey" placeholder="Enter game key">

    <button id = "createButton">Create Game</button>
    <button id = "joinButton">Join Game</button>

    <p id = "message"></p>

    

    <div id="board" class="board">

    <button class="cell" data-x="0" data-y="0"></button>
    <button class="cell" data-x="1" data-y="0"></button>
    <button class="cell" data-x="2" data-y="0"></button>

    <button class="cell" data-x="0" data-y="1"></button>
    <button class="cell" data-x="1" data-y="1"></button>
    <button class="cell" data-x="2" data-y="1"></button>

    <button class="cell" data-x="0" data-y="2"></button>
    <button class="cell" data-x="1" data-y="2"></button>
    <button class="cell" data-x="2" data-y="2"></button>
    
    </div>

    <script src="services.js"></script>
    <script src="app.js"></script>
    <script src="board.js"></script>


</body>
</html>
